name: Sync Image to Aliyun ACR

on:
  workflow_dispatch: # 支持手动点击运行
    inputs:
      source_image:
        description: '源镜像 (例如 nextcloud:latest 或 nextcloud:apache)'
        required: true
        default: 'nextcloud:latest'  # 默认设置为 Nextcloud 官方镜像
      target_tag:
        description: '推送到 ACR 的镜像 Tag (例如 nextcloud-latest 或 v28.0)'
        required: true
        default: 'nextcloud-latest'  # 默认推送后的 Tag 名称

jobs:
  sync-image:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}  # 值已在 GitHub Secrets 设置为 yczh83116
          password: ${{ secrets.ACR_PASSWORD }}  # 值已在 GitHub Secrets 设置为 123456

      - name: Pull and Push Image
        run: |
          # 1. 从 Docker Hub 拉取海外 Nextcloud 镜像
          docker pull ${{ github.event.inputs.source_image }}
          
          # 2. 重新打 Tag 关联到您的 ACR 仓库 (xcz_2026 命名空间 / yczh83116 仓库)
          docker tag ${{ github.event.inputs.source_image }} registry.cn-chengdu.aliyuncs.com/xcz_2026/yczh83116:${{ github.event.inputs.target_tag }}
          
          # 3. 推送到阿里云 ACR
          docker push registry.cn-chengdu.aliyuncs.com/xcz_2026/yczh83116:${{ github.event.inputs.target_tag }}
